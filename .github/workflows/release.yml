name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists. Bump the version before releasing." >&2
            exit 1
          fi
          echo "Release tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: local-dev-proxy-macos-arm64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: local-dev-proxy-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: local-dev-proxy-linux-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: local-dev-proxy-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Slint's text stack links fontconfig on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          app="dist/Local Dev Proxy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/local-dev-proxy" "$app/Contents/MacOS/"
          cp assets/dock-icon.icns "$app/Contents/Resources/"
          sed "s/@VERSION@/${version}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          ditto -c -k --keepParent "$app" "dist/${{ matrix.asset }}"

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}" local-dev-proxy

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/local-dev-proxy.exe" -DestinationPath "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  create-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 release assets, found ${#assets[@]}" >&2
            exit 1
          fi

          prerelease_flag=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            $prerelease_flag \
            "${assets[@]}"
