name: Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="local-dev-proxy") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not parse version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tag and title always come from the Cargo.toml version; whether it is a
          # prerelease depends only on the branch (anything other than main).
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "release_title=Prerelease v$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_title=Release v$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.tag.outputs.release_tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.tag.outputs.release_tag }} already exists on remote. Bump the version before releasing."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A draft does not create the git tag, so a stale draft from a failed run
          # is the only thing that can collide here.
          if gh release view "${{ steps.tag.outputs.release_tag }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.tag.outputs.release_tag }}"
            gh release delete "${{ steps.tag.outputs.release_tag }}" --yes
          fi
          args=()
          if [ "${{ steps.tag.outputs.is_prerelease }}" = "true" ]; then
            args+=(--prerelease)
          else
            # Generate notes against the previous stable release, not the latest prerelease.
            prev_stable=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$prev_stable" ]; then
              args+=(--notes-start-tag "$prev_stable")
            fi
          fi
          gh release create "${{ steps.tag.outputs.release_tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ steps.tag.outputs.release_title }}" \
            --generate-notes \
            "${args[@]}"

  build-linux:
    needs: setup
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # Slint's text stack links fontconfig on Linux.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir -p dist
          mv target/${{ matrix.target }}/release/local-dev-proxy dist/local-dev-proxy-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: dist/local-dev-proxy-${{ matrix.suffix }}
          if-no-files-found: error

  build-macos:
    needs: setup
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: macos-arm64
          # Cross-compiled for Intel Macs on the Apple silicon runner.
          - target: x86_64-apple-darwin
            suffix: macos-amd64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package app (.dmg, unsigned)
        # Unsigned: browser downloads get the quarantine attribute; the README
        # documents the xattr workaround. The disk image holds the .app next to
        # an Applications link for drag-to-install.
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          staging="dist/dmg"
          app="$staging/Local Dev Proxy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/local-dev-proxy" "$app/Contents/MacOS/"
          cp assets/dock-icon.icns "$app/Contents/Resources/"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Local Dev Proxy" -srcfolder "$staging" -ov -format UDZO \
            "dist/local-dev-proxy-${{ matrix.suffix }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: dist/local-dev-proxy-${{ matrix.suffix }}.dmg
          if-no-files-found: error

  build-windows:
    needs: setup
    # Windows ships with stable releases only.
    if: needs.setup.outputs.is_prerelease == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item target\x86_64-pc-windows-msvc\release\local-dev-proxy.exe dist\local-dev-proxy-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/local-dev-proxy-windows-amd64.exe
          if-no-files-found: error

  publish-release:
    needs: [setup, build-linux, build-macos, build-windows]
    # Runs when build-windows is skipped for a prerelease, but never after a failure.
    if: always() && needs.setup.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.setup.outputs.release_tag }}" artifacts/* --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
